name: relay-waydroid-sys

# Mirrors lineage-20.0-20260927-VANILLA-waydroid_x86_64-system.zip from a slow origin into this repository's releases.
# Generated by github-relay-mirror/scripts/emit-relay-workflow.sh
#
# The Download step is the point of this file. A plain
#   curl -fL --retry 5 --retry-all-errors
# hangs forever on an origin that accepts the connection, delivers a few
# hundred KB, then goes to 0 B/s - the connection is still open, so --retry
# never fires. Measured on SourceForge: 241 KB delivered, then 0 B/s for 30
# minutes until the job timeout killed it.

on:
  workflow_dispatch:
    inputs:
      expected_size:
        description: 'Expected byte count of the file'
        required: true
        type: string
        default: '847449341'
      mirrors:
        description: 'Space separated mirror names (origin specific)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  ORIGIN_DIR: 'https://sourceforge.net/projects/waydroid/files/images/system/lineage/waydroid_x86_64'
  FILE_NAME: 'lineage-20.0-20260927-VANILLA-waydroid_x86_64-system.zip'
  RELEASE_TAG: 'relay-waydroid-sys'

jobs:
  relay:
    name: fetch, verify, release
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Download with stall detection and mirror rotation
        shell: bash
        run: |
          set -u
          EXPECT="${{ github.event.inputs.expected_size }}"
          MIRRORS="${{ github.event.inputs.mirrors }}"
          [ -n "$MIRRORS" ] || MIRRORS="netix jaist cfhcable pilotfiber phoenixnap tenet"
          N=$(echo $MIRRORS | wc -w)

          fails=0
          attempt=0
          while :; do
            have=0
            [ -f "$FILE_NAME" ] && have=$(wc -c < "$FILE_NAME" | tr -d ' ')
            if [ "$have" -ge "$EXPECT" ]; then
              echo "complete: $have bytes"
              break
            fi
            if [ "$fails" -ge 10 ]; then
              echo "::error::10 consecutive attempts made no progress at $have bytes"
              exit 1
            fi
            attempt=$((attempt + 1))
            M=$(echo $MIRRORS | cut -d' ' -f $(( (attempt - 1) % N + 1 )))
            echo "--- attempt $attempt  mirror=$M  have=$have ---"
            curl -fL -C - \
                 --speed-time 60 --speed-limit 2048 \
                 --retry 2 --retry-delay 5 --retry-all-errors \
                 -o "$FILE_NAME" "$ORIGIN_DIR/$FILE_NAME/download?use_mirror=$M" || true
            new=0
            [ -f "$FILE_NAME" ] && new=$(wc -c < "$FILE_NAME" | tr -d ' ')
            if [ "$new" -gt "$have" ]; then
              fails=0
              echo "  +$((new - have)) bytes, now $new"
            else
              fails=$((fails + 1))
              echo "::warning::mirror $M made no progress (fail $fails/10), rotating"
            fi
          done
          ls -lh "$FILE_NAME"

      - name: Verify
        shell: bash
        run: |
          set -eu
          EXPECT="${{ github.event.inputs.expected_size }}"
          SIZE=$(wc -c < "$FILE_NAME" | tr -d ' ')
          echo "size: $SIZE bytes"
          [ "$SIZE" = "$EXPECT" ] || { echo "::error::size mismatch, expected $EXPECT"; exit 1; }
          unzip -tq "$FILE_NAME" >/dev/null 2>&1 || true
          SHA=$(sha256sum "$FILE_NAME" | awk '{print $1}')
          echo "sha256: $SHA"
          {
            echo "### $RELEASE_TAG"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| file | \`$FILE_NAME\` |"
            echo "| size | $SIZE |"
            echo "| sha256 | \`$SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # release assets, not artifacts: 500 MB artifact cap vs 2 GB per asset
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "relay-waydroid-sys" --notes "Mirrored artifact. sha256 is in the run summary."
          gh release upload "$RELEASE_TAG" "$FILE_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)\t\(.digest)"'
